shift:
  kicker: "Pergeseran"
  title: "Fokus pada business outcome = Fokus pada pengguna"
  intro: >-
    Scrum punya tiga akuntabilitas, dan tidak satu pun berbunyi “mengetik
    kode”. Ketika implementasi diambil alih AI, masing-masing bisa menjalankan
    apa yang digambarkan Scrum Guide.
  before: "Dulu"
  now: "Dengan AI"
  roles:
    - token: "PO"
      role: "Product Owner"
      before: "Sering kali hanya proxy atau juru tulis, mengubah permintaan menjadi tiket yang cukup rinci untuk pengerjaan yang panjang."
      now: "Seseorang yang punya kuasa sekaligus perhatian atas produk: cukup senior untuk fokus penuh pada tujuan bisnis dan metrik bisnis, tanpa proxy atau juru tulis di tengah. Bersedia memimpin Sprint Review di setiap Sprint, entah dua minggu atau sebulan, untuk mengevaluasi bisnis dan menetapkan business outcome berikutnya."
    - token: "Dev"
      role: "Developers"
      before: "Sebagian besar Sprint habis untuk detail implementasi."
      now: "Dengan AI mengambil alih detail implementasi, Developers jadi terpaksa bergeser ke pekerjaan yang lebih butuh zoom-out & berpikir abstrak. Memberi instruksi ke AI pun hanya jadi sebagian kecil pekerjaan. Mayoritas waktu akan habis untuk merekrut sampel pengguna, wawancara pengguna, melihat metrik penggunaan, dan brainstorming cara mencapai business outcome yang ditentukan oleh Product Owner."
    - token: "SM"
      role: "Scrum Master"
      before: "Banyak energi habis untuk menjaga proses delivery yang panjang tetap berjalan."
      now: "Jadi bisa fokus memfasilitasi interaksi Developers dengan pengguna, tempat asumsi divalidasi dan nilai tercipta. Tentunya dengan tetap memastikan lancarnya interaksi antara stakeholder, Product Owner, dan Developers."

