{%- assign q = site.data.guide.quotes[include.key] -%}
{%- assign g = include.t.gloss[include.key] -%}
<figure class="gq{% if include.big %} gq-big{% endif %}">
  <blockquote lang="en" cite="{{ site.data.guide.url }}#{{ q.anchor }}"><p>“{{ q.text }}”</p></blockquote>
  <figcaption>{{ include.t.additions.source_label }} · <a href="{{ site.data.guide.url }}#{{ q.anchor }}" rel="noopener">{{ q.section }}</a>
    {%- if g %} · <button type="button" class="gq-tgl" aria-expanded="false" aria-controls="gl-{{ include.key }}">{{ include.t.additions.gloss_label }}</button>{% endif %}</figcaption>
  {%- if g %}
  <p class="gq-gloss" id="gl-{{ include.key }}"><span>{{ include.t.additions.gloss_label }}:</span> {{ g }}</p>
  {%- endif %}
</figure>
